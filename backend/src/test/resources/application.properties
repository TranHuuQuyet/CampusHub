# Su dung H2 in-memory database khi chay automated tests.
spring.datasource.url=jdbc:h2:mem:campushub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Tai khoan mac dinh cua H2.
spring.datasource.username=sa
spring.datasource.password=

# Moi lan test chay, Hibernate tao schema moi.
# Khi test ket thuc, schema se bi xoa.
spring.jpa.hibernate.ddl-auto=create-drop

# Khong can in SQL trong log test.
spring.jpa.show-sql=false
